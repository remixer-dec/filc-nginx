name: filc-nginx-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build from scratch
        run: bash scripts/build-from-scratch.sh

      - name: Package binary
        env:
          PIZFIX_LIB: /tmp/filc-0.678-linux-x86_64/pizfix/lib
        run: bash scripts/package-filc-standalone.sh

      - name: Generate SHA256
        run: |
          sha256sum filc-nginx.tar.gz

      - name: Capture nginx -V (default build)
        run: ./objs-filc/nginx -V 2>&1 | tee nginx-v-default.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filc-nginx
          path: |
            filc-nginx.tar.gz
            nginx-v-default.txt
          retention-days: 90

  build-optfil:
    runs-on: ubuntu-latest
    container: debian:13

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: bash scripts/ci-preinstall.sh

      - name: Build filc dependencies from prebuilt optfil toolchain
        env:
          FILC_ROOT: /opt/fil
          DEPS_DIR: /tmp/filc-deps
        run: bash scripts/build-filc-deps.sh

      - name: Configure nginx for filc
        env:
          DEPS_DIR: /tmp/filc-deps
        run: |
          export PATH=/opt/fil/bin:$PATH
          export CC=filcc
          export CXX=fil++
          bash scripts/configure-filc-nginx.sh

      - name: Build nginx
        run: |
          export PATH=/opt/fil/bin:$PATH
          make -f objs-filc/Makefile -j"$(nproc)"

      - name: Package optfil bundle
        env:
          BUILD_DIR: ${{ github.workspace }}/objs-filc
        run: bash scripts/package-opt-filc-nginx.sh

      - name: Rename optfil bundle
        run: mv filc-nginx.tar.gz filc-nginx-optfil.tar.gz

      - name: Generate SHA256
        run: sha256sum filc-nginx-optfil.tar.gz

      - name: Capture nginx -V (optfil build)
        run: ./objs-filc/nginx -V 2>&1 | tee nginx-v-optfil.txt

      - name: Upload optfil artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filc-nginx-optfil
          path: |
            filc-nginx-optfil.tar.gz
            nginx-v-optfil.txt
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: [build, build-optfil]
    permissions:
      contents: write
    steps:
      - name: Download default artifact
        uses: actions/download-artifact@v4
        with:
          name: filc-nginx
          path: dist

      - name: Download optfil artifact
        uses: actions/download-artifact@v4
        with:
          name: filc-nginx-optfil
          path: dist

      - name: Show checksums
        run: sha256sum dist/filc-nginx.tar.gz dist/filc-nginx-optfil.tar.gz

      - name: Build release notes
        shell: bash
        run: |
          {
            echo "Automated build on Debian 13 (trixie) with Fil-C 0.678."
            echo
            echo "Artifacts:"
            echo "- filc-nginx.tar.gz (build-from-scratch flow, contains static OpenSSL)"
            echo "- filc-nginx-optfil.tar.gz (prebuilt optfil flow)"
            echo
            echo "nginx -V output (filc-nginx.tar.gz):"
            echo '```'
            cat dist/nginx-v-default.txt
            echo '```'
            echo
            echo "nginx -V output (filc-nginx-optfil.tar.gz):"
            echo '```'
            cat dist/nginx-v-optfil.txt
            echo '```'
          } > dist/release-notes.md

      - name: Get version tag
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "tag=filc-nginx-$(date +%Y%m%d)-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Fil-C Nginx ${{ steps.version.outputs.tag }}
          body_path: dist/release-notes.md
          files: |
            dist/filc-nginx.tar.gz
            dist/filc-nginx-optfil.tar.gz
