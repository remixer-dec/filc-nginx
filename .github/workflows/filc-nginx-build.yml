name: filc-nginx-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build from scratch
        run: bash scripts/build-from-scratch.sh

      - name: Package binary
        env:
          PIZFIX_LIB: /tmp/filc-0.678-linux-x86_64/pizfix/lib
        run: bash scripts/package-filc-standalone.sh

      - name: Generate SHA256
        run: |
          sha256sum filc-nginx.tar.gz > filc-nginx.tar.gz.sha256
          cat filc-nginx.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filc-nginx
          path: |
            filc-nginx.tar.gz
            filc-nginx.tar.gz.sha256
          retention-days: 90

      - name: Get version tag
        id: version
        run: |
          VERSION="filc-nginx-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Fil-C Nginx ${{ steps.version.outputs.tag }}"
          body: "Automated build on Debian 13 (trixie) with Fil-C 0.678.\n\n- nginx 1.31.0\n- OpenSSL 3.3.1\n- clang 20.1.8 (Fil-C)\n- zlib 1.3, PCRE2 10.44"
          files: |
            filc-nginx.tar.gz
            filc-nginx.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
